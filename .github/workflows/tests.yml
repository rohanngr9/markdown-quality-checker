name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python -m unittest -v

      - name: Check sample Markdown
        run: |
          set +e
          python markdown_checker.py examples/sample.md
          result=$?
          set -e

          if [ "$result" -ne 1 ]; then
            echo "Expected the sample checker to return exit code 1."
            exit 1
          fi
